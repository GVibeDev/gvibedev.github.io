name: Deploy B&W Survivors to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage static single-player runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html game.js style.css online-runtime.js online-runtime.css manifest.webmanifest _site/
          cp icon.png iconbig.png icon-180.png icon-192.png _site/
          cp -R gameassets _site/gameassets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
